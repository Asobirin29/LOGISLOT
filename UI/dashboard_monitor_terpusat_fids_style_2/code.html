<style>
        body {
            background-color: #f8f9ff; /* surface */
            color: #0b1c30; /* on-surface */
            overflow: hidden; /* No scrollbars for TV */
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Blinking Animation */
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
        .blink-live {
            animation: blink 1s infinite;
        }
        .blink-warning {
            animation: blink 1.5s infinite;
        }

        /* Auto-scroll Animation for Table */
        @keyframes autoScroll {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(-100% + 100vh - 250px)); /* Rough calc based on header/summary height */ }
        }
        
        /* Table Styles for Large Display */
        th {
            font-size: 24px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 24px;
            text-align: left;
            background-color: #e5eeff; /* surface-container */
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            font-size: 28px; /* Extra large for TV */
            font-weight: 600;
            padding: 24px;
            border-bottom: 1px solid #c4c6cf; /* outline-variant */
        }
        tr:nth-child(even) {
            background-color: #ffffff;
        }
        tr:nth-child(odd) {
            background-color: #f8f9ff;
        }

        /* Row Highlights */
        tr.delayed-row {
            background-color: #FDECEA !important; /* Specific light red requested */
        }

        .scroll-container {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
        }

        .scroll-content {
            /* JavaScript will handle the scrolling to make it seamless */
            width: 100%;
            position: absolute;
        }

        /* Hide scrollbar completely but allow JS to scroll */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
<!-- Header (100px height, #1B365D solid) -->
<header class="h-[100px] bg-primary-container text-on-primary flex items-center justify-between px-lg shrink-0 relative shadow-md z-20">
<!-- Left: Logo -->
<div class="font-headline-lg text-headline-lg font-bold tracking-wider w-1/4">
            LOGISLOT
        </div>
<!-- Center: Title -->
<div class="text-[40px] font-bold tracking-tight text-center flex-grow">
            MONITORING ARMADA REAL-TIME
        </div>
<!-- Right: Clock & Date -->
<div class="w-1/4 flex flex-col items-end text-right">
<div class="text-[36px] font-bold font-code leading-none" id="live-clock">00:00:00</div>
<div class="text-[20px] text-on-primary-container font-semibold mt-1" id="live-date">DD MMM YYYY</div>
</div>
<!-- Top Right: LIVE Indicator -->
<div class="absolute top-4 right-6 flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-green-400 blink-live shadow-[0_0_8px_#4ade80]"></div>
<span class="text-green-400 font-bold text-sm tracking-widest">LIVE</span>
</div>
</header>
<!-- Summary Bar (4 equal columns) -->
<div class="grid grid-cols-4 bg-white shrink-0 z-10 shadow-sm relative z-20">
<!-- TOTAL HARI INI -->
<div class="p-lg flex flex-col items-center justify-center border-b-[8px] border-black">
<div class="text-on-surface-variant font-headline-sm uppercase tracking-wider mb-2">Total Hari Ini</div>
<div class="text-[64px] font-bold text-on-surface leading-none">142</div>
</div>
<!-- DI GERBANG -->
<div class="p-lg flex flex-col items-center justify-center border-b-[8px] border-[#F9A825]">
<div class="text-on-surface-variant font-headline-sm uppercase tracking-wider mb-2">Di Gerbang</div>
<div class="text-[64px] font-bold text-on-surface leading-none">18</div>
</div>
<!-- SEDANG BONGKAR -->
<div class="p-lg flex flex-col items-center justify-center border-b-[8px] border-[#1B365D]">
<div class="text-on-surface-variant font-headline-sm uppercase tracking-wider mb-2">Sedang Bongkar</div>
<div class="text-[64px] font-bold text-on-surface leading-none">34</div>
</div>
<!-- SELESAI -->
<div class="p-lg flex flex-col items-center justify-center border-b-[8px] border-[#2E7D32]">
<div class="text-on-surface-variant font-headline-sm uppercase tracking-wider mb-2">Selesai</div>
<div class="text-[64px] font-bold text-on-surface leading-none">90</div>
</div>
</div>
<!-- Table Container (Fills remaining space, auto-scrolls) -->
<div class="scroll-container bg-surface w-full">
<table class="w-full text-left border-collapse" id="fids-table">
<thead class="bg-surface-container">
<tr>
<th class="w-[12%] text-on-surface">JAM SLOT</th>
<th class="w-[15%] text-on-surface">PLAT NOMOR</th>
<th class="w-[20%] text-on-surface">SUPPLIER</th>
<th class="w-[15%] text-on-surface">DOCK TUJUAN</th>
<th class="w-[18%] text-on-surface">STATUS</th>
<th class="w-[20%] text-on-surface">WAKTU TUNGGU</th>
</tr>
</thead>
<tbody id="table-body">
<!-- Rows will be injected here via JS for easy duplication to enable smooth scrolling -->
</tbody>
</table>
</div>
<script>
        // --- Clock & Date Logic ---
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour12: false });
            const dateString = now.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
            
            document.getElementById('live-clock').textContent = timeString;
            document.getElementById('live-date').textContent = dateString;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- Mock Data & Rendering ---
        const data = [
            { time: "08:00 - 09:00", plate: "B 1234 CD", supplier: "PT. MAJU BERSAMA", dock: "DOCK A-1", status: "Selesai", statusCode: "completed", waitTime: "On Time" },
            { time: "09:00 - 10:00", plate: "D 5678 EF", supplier: "CV. LOGISTIK JAYA", dock: "DOCK B-2", status: "Sedang Bongkar", statusCode: "unloading", waitTime: "15 Menit" },
            { time: "09:30 - 10:30", plate: "B 9012 GH", supplier: "PT. SUMBER PANGAN", dock: "DOCK A-3", status: "Di Gerbang", statusCode: "arrived", waitTime: "5 Menit" },
            { time: "10:00 - 11:00", plate: "L 3456 IJ", supplier: "PT. NUSA CARGO", dock: "DOCK C-1", status: "Terjadwal", statusCode: "booked", waitTime: "-" },
            { time: "08:30 - 09:30", plate: "B 7890 KL", supplier: "CV. BINTANG TERANG", dock: "DOCK A-2", status: "Terlambat >30 menit", statusCode: "delayed", waitTime: "45 Menit" },
            { time: "10:30 - 11:30", plate: "F 1122 MN", supplier: "PT. INDO DISTRIBUSI", dock: "DOCK B-1", status: "Terjadwal", statusCode: "booked", waitTime: "-" },
            { time: "09:15 - 10:15", plate: "B 3344 OP", supplier: "PT. AGUNG TRANS", dock: "DOCK C-2", status: "Sedang Bongkar", statusCode: "unloading", waitTime: "10 Menit" },
            { time: "11:00 - 12:00", plate: "D 5566 QR", supplier: "CV. MANDIRI SENTOSA", dock: "DOCK A-1", status: "Terjadwal", statusCode: "booked", waitTime: "-" },
             { time: "10:00 - 11:00", plate: "L 9988 ST", supplier: "PT. GLOBAL LOGISTIK", dock: "DOCK B-3", status: "Di Gerbang", statusCode: "arrived", waitTime: "12 Menit" },
            { time: "07:30 - 08:30", plate: "B 7766 UV", supplier: "PT. JAYA ABADI", dock: "DOCK A-3", status: "Selesai", statusCode: "completed", waitTime: "On Time" },
        ];

        function getStatusHtml(status, statusCode) {
            let bgColor, textColor, iconName;

            switch(statusCode) {
                case 'booked':
                    bgColor = '#1B365D'; textColor = '#FFFFFF'; iconName = 'schedule'; break;
                case 'arrived':
                    bgColor = '#F9A825'; textColor = '#000000'; iconName = 'sensor_door'; break;
                case 'unloading':
                    bgColor = '#F57F17'; textColor = '#000000'; iconName = 'forklift'; break; // Darker yellow/orange
                case 'completed':
                    bgColor = '#2E7D32'; textColor = '#FFFFFF'; iconName = 'check_circle'; break;
                case 'delayed':
                    bgColor = '#D32F2F'; textColor = '#FFFFFF'; iconName = 'warning'; break;
                default:
                    bgColor = '#74777F'; textColor = '#FFFFFF'; iconName = 'info';
            }

            const iconHtml = `<span class="material-symbols-outlined text-[28px] mr-2" style="font-variation-settings: 'FILL' 1;">${iconName}</span>`;
            const labelHtml = `<span class="text-[22px] font-bold tracking-wide uppercase">${status}</span>`;

            if (statusCode === 'delayed') {
                 // The requirement asked for the icon to blink in the status column for delayed
                return `<div class="inline-flex items-center px-4 py-2 rounded-full" style="background-color: ${bgColor}; color: ${textColor};">
                            <span class="material-symbols-outlined text-[28px] mr-2 blink-warning" style="font-variation-settings: 'FILL' 1;">${iconName}</span>
                            <span class="text-[22px] font-bold tracking-wide uppercase">${status}</span>
                        </div>`;
            }

            return `<div class="inline-flex items-center px-4 py-2 rounded-full" style="background-color: ${bgColor}; color: ${textColor};">
                        ${iconHtml}
                        ${labelHtml}
                    </div>`;
        }

        function renderTableRows(dataArray, tbodyElement) {
            let rowsHtml = '';
            dataArray.forEach(item => {
                const isDelayed = item.statusCode === 'delayed';
                const rowClass = isDelayed ? 'delayed-row' : '';
                const waitTimeHtml = isDelayed 
                    ? `<span class="text-error font-bold">${item.waitTime}</span>` 
                    : item.waitTime;

                rowsHtml += `
                    <tr class="${rowClass}">
                        <td class="font-code text-on-surface-variant">${item.time}</td>
                        <td class="font-bold text-primary-container text-[32px] tracking-widest">${item.plate}</td>
                        <td class="text-on-surface">${item.supplier}</td>
                        <td class="font-bold text-secondary text-[26px]">${item.dock}</td>
                        <td>${getStatusHtml(item.status, item.statusCode)}</td>
                        <td class="text-on-surface-variant">${waitTimeHtml}</td>
                    </tr>
                `;
            });
            tbodyElement.innerHTML += rowsHtml;
        }

        const tbody = document.getElementById('table-body');
        
        // Render initial data multiple times to create enough content to scroll
        renderTableRows(data, tbody);
        renderTableRows(data, tbody); // Duplicate for seamless scroll loop if needed

        // --- Auto Scroll Logic ---
        const scrollContainer = document.querySelector('.scroll-container');
        let scrollPos = 0;
        const scrollSpeed = 0.5; // Pixels per frame

        function autoScroll() {
            if (!scrollContainer) return;

            scrollPos += scrollSpeed;
            scrollContainer.scrollTop = scrollPos;

            // Reset logic (simplistic approach for demo)
            // In a real app, you'd calculate exact height to snap back for a true infinite loop
            if (scrollPos > scrollContainer.scrollHeight - scrollContainer.clientHeight - 10) {
                 scrollPos = 0;
            }

            requestAnimationFrame(autoScroll);
        }

        // Start scrolling after a short delay
        setTimeout(() => {
            requestAnimationFrame(autoScroll);
        }, 3000);

    </script>
</body></html>
