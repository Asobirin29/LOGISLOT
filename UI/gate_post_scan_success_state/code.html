<body class="bg-success text-on-success h-screen w-full flex flex-col justify-center items-center p-md lg:p-xl selection:bg-surface selection:text-success">
<div class="w-full max-w-2xl flex flex-col items-center">
<!-- Success Icon -->
<div class="mb-lg animate-bounce">
<span class="material-symbols-outlined text-[120px] text-on-success leading-none" data-icon="check_circle" data-weight="fill">check_circle</span>
</div>
<!-- Main Headline -->
<h1 class="font-headline-lg text-headline-lg text-center mb-xl tracking-tight">CHECK-IN BERHASIL</h1>
<!-- Details Card -->
<div class="bg-surface w-full rounded-xl p-lg lg:p-xl shadow-lg border-2 border-surface-container-high flex flex-col gap-lg">
<!-- License Plate - Emphasized -->
<div class="text-center pb-md border-b border-outline-variant">
<span class="font-label-md text-label-md text-outline block mb-xs uppercase tracking-widest">Plat Nomor</span>
<span class="font-headline-lg text-headline-lg text-primary block leading-none">B 9182 TEQ</span>
</div>
<!-- Supplier -->
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline" data-icon="factory">factory</span>
<div>
<span class="font-label-md text-label-md text-outline block">Nama Supplier</span>
<span class="font-headline-sm text-headline-sm text-on-surface block">PT. Global Logistik Sejahtera</span>
</div>
</div>
<!-- Time Comparison -->
<div class="grid grid-cols-2 gap-md bg-surface-container-low p-md rounded-lg">
<div class="border-r border-outline-variant">
<span class="font-label-md text-label-md text-outline block">Jadwal</span>
<span class="font-headline-sm text-headline-sm text-on-surface block">10:00</span>
</div>
<div class="pl-md">
<span class="font-label-md text-label-md text-outline block">Aktual</span>
<div class="flex items-center gap-xs">
<span class="font-headline-sm text-headline-sm text-success block">09:45</span>
<span class="material-symbols-outlined text-success text-sm" data-icon="timer">timer</span>
</div>
</div>
</div>
<!-- Driver -->
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline" data-icon="badge">badge</span>
<div>
<span class="font-label-md text-label-md text-outline block">Nama Sopir</span>
<span class="font-body-lg text-body-lg text-on-surface block font-medium">Budi Santoso</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="mt-xl w-full max-w-md border-4 border-on-success rounded-lg py-md px-lg font-headline-sm text-headline-sm text-on-success bg-transparent hover:bg-on-success hover:text-success transition-colors duration-200 flex items-center justify-center gap-sm uppercase tracking-wide">
<span class="material-symbols-outlined" data-icon="barcode_scanner">barcode_scanner</span>
