version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    container_name: logislot_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    networks:
      - logislot-network
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: logislot_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://logislot:secret123@db:5432/logislot?schema=public
      - REDIS_URL=redis://redis:6379
    networks:
      - logislot-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: logislot_db
    restart: always
    environment:
      POSTGRES_USER: logislot
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: logislot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - logislot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logislot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logislot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - logislot-network

  nginx:
    image: nginx:alpine
    container_name: logislot_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - logislot-network
    depends_on:
      - frontend
      - backend

networks:
  logislot-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
